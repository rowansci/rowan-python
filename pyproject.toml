[project]
name = "rowan-python"
version = "3.3.2"
description = "Rowan Python Library"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13"
authors = [
    { name = "Corin Wagen", email = "corin@rowansci.com" },
    { name = "Eli Mann", email = "eli@rowansci.com" },
]
dependencies = [
    "stjames>=0.0.297",
    # External
    "httpx",
    "nest-asyncio",
    "rdkit",
    "setuptools",
]

[project.urls]
"Homepage" = "https://github.com/rowansci/rowan-python"
"Documentation" = "https://docs.rowansci.com/python-api"
"Bug Tracker" = "https://github.com/rowansci/rowan-python/issues"

[dependency-groups]
dev = [
    "ipython",
    "pytest>=9",
    "pytest-cov>=7.1",
    "python-dotenv",
    "ty>=0.0.81",
]
docs = [
    "griffe-pydantic",
    "mkdocs-material",
    "mkdocstrings-python",
]

[tool.uv]
exclude-newer = "7 days"
exclude-newer-package = { stjames = false }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rowan"]

[tool.hatch.build.targets.sdist]
exclude = [
    "/AGENTS.md",
    "/.agents",
    "/.claude",
    "/.envrc",
    "/prek.toml",
]

[tool.pytest.ini_options]
testpaths = ["rowan", "tests"]
addopts = "--doctest-modules --durations=5"
doctest_optionflags = "NORMALIZE_WHITESPACE"
markers = [
    "regression: tests to make sure bugs stay closed",
]

[tool.coverage.run]
source = ["rowan"]

[tool.coverage.report]
exclude_lines = [
    'pragma: no cover',
    'def __repr__',
    'if self\.debug',
    'raise AssertionError',
    'raise NotImplementedError',
    'if 0:',
    'if __name__ == .__main__.:',
    '^\s*\.\.\.',
]
