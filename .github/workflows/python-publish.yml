name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    # Enable after configuring the repository environment.
    # environment:
    #   name: pypi
    steps:
      - name: Skip if running with act
        if: ${{ env.ACT == 'true' }}
        run: exit 1

      - name: Checkout
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0

      - name: Install Python
        run: uv python install

      - name: Build
        run: uv build

      - name: Smoke test (wheel)
        run: >-
          uv run --isolated --no-project --directory "$RUNNER_TEMP"
          --with "$GITHUB_WORKSPACE"/dist/*.whl python -c "import rowan"

      - name: Smoke test (source distribution)
        run: >-
          uv run --isolated --no-project --directory "$RUNNER_TEMP"
          --with "$GITHUB_WORKSPACE"/dist/*.tar.gz python -c "import rowan"

      - name: Publish
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: uv publish
