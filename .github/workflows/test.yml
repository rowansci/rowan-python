name: Test

on:
  pull_request: {}
  push:
    branches: master

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      matrix:
        python-version: ["3.12", "3.14"]
        os: [ubuntu-latest]

    name: Python ${{ matrix.os }} ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6

      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@v7.6
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --locked

      - name: Check TOML/YAML/whitespace
        run: |
          uv run prek run --all-files --show-diff-on-failure --color=always \
            check-toml check-yaml trailing-whitespace end-of-file-fixer

      # Enable Markdown checks after the style migration.
      # - run: uv run rumdl fmt --check --diff .
      # - run: uv run rumdl check .

      - run: uv run ruff format --check --diff .
      - run: uv run ruff check .

      - run: uv run ty check

      - run: uv run pytest --cov --cov-report=xml

      # Enable after configuring Codecov and its repository token.
      # - name: Upload coverage to Codecov
      #   uses: codecov/codecov-action@v5
      #   with:
      #     token: ${{ secrets.CODECOV_TOKEN }}
