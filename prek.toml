# schema https://www.schemastore.org/prek.json
exclude = '(^\.venv/|^\.pixi/|\.dat$|\.patch$)'
default_install_hook_types = ["pre-commit", "pre-push"]
default_stages = ["pre-commit", "pre-push"]

[[repos]]
repo = "builtin"
hooks = [
  { id = "check-toml" },
  { id = "check-yaml", args = ["--unsafe"] },
  { id = "check-merge-conflict" },
  { id = "end-of-file-fixer" },
  { id = "trailing-whitespace" },
]

[[repos]]
repo = "local"

[[repos.hooks]]
id = "uv-lock-check"
name = "uv lock --check"
language = "system"
entry = "uv lock --check"
files = '^(pyproject\.toml|uv\.lock)$'
pass_filenames = false

[[repos.hooks]]
id = "rumdl-fmt"
name = "rumdl-fmt"
language = "system"
entry = "uv run rumdl fmt ."
types = ["markdown"]
pass_filenames = false

[[repos.hooks]]
id = "rumdl-check"
name = "rumdl-check"
language = "system"
entry = "uv run rumdl check . --fix"
types = ["markdown"]
pass_filenames = false

[[repos.hooks]]
id = "ruff-format"
name = "ruff-format"
language = "system"
entry = "uv run ruff format ."
types_or = ["python", "pyi"]
pass_filenames = false

[[repos.hooks]]
id = "ruff-check"
name = "ruff-check"
language = "system"
entry = "uv run ruff check . --fix"
types_or = ["python", "pyi"]
pass_filenames = false

[[repos.hooks]]
id = "ty"
name = "ty"
language = "system"
entry = "uv run ty check"
types_or = ["python", "pyi"]
pass_filenames = false

[[repos.hooks]]
id = "pytest"
name = "pytest"
language = "system"
entry = "uv run pytest"
always_run = true
pass_filenames = false
stages = ["pre-push"]
